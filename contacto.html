<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DestinoSur Patagonia | Contacto</title>
    <link rel="stylesheet" href="./css/estilo-general.css">
    <link rel="stylesheet" href="./css/estilo-contacto.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo">
                🏔️                    
                <p>DestinoSur</p>
                <span>PATAGONIA</span>
            </div>
            <div class="nav-menu">
                <a href="./index.html">Inicio</a>
                <a href="./servicios.html">Servicios</a>
                <a href="./resumen.html">Mi Viaje</a>
                <a href="./contacto.html">Contacto</a>
            </div>
        </div>
    </header>

    <main>
        <div class="hero">
            <h1>Contacto y Consultas de Reserva</h1>
            <p>Dejanos tus datos y nos comunicaremos para asesorarte con la reserva de tu viaje.</p>
        </div>

        <form action="" class="formulario" id="formulario" novalidate>
            <ul>
                <li>
                    <label for="nombre">Nombre Completo *</label>
                    <input type="text" id="nombre" name="nombre_usuario" placeholder="Ej: Mario Perez">
                </li>
                <li>
                    <label for="mail">Correo Electrónico *</label>
                    <input type="email" id="mail" name="email_usuario" placeholder="usario@mail.com">
                </li>
                <li>
                    <label for="tel">Teléfono de Contacto *</label>
                    <input type="tel" id="tel" name="tel_usuario" placeholder="Ej: 2664123456">
                </li>
                <li>
                    <label for="mensaje">Consulta o Mensaje *</label>
                    <textarea name="mensaje_usuario" id="mensaje" rows="5" placeholder="Deja tu mensaje acá"></textarea>
                </li>
                <li id="liBtn">
                    <button type="submit">Enviar Consulta</button>
                </li>
            </ul>
        </form>

        
    </main>

    <footer>
        <div class="footer-container">
            <p>© 2026 DestinoSur Patagonia <span>|</span> Tel: +54 266 4123456 <span>|</span> Email: consultas@destinosur.com.ar <span>|</span> Redes: Instagram <span>|</span> facebook</p>
        </div>
    </footer>

    <script src="./js/contacto.js"></script>
</body>
</html>
